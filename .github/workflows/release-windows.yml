name: Release Windows

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Package Windows Installer (Tauri 2 NSIS / MSI)
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: "pnpm"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run verification test suite
        run: pnpm run test

      - name: Build monorepo packages
        run: pnpm run build

      - name: Package Tauri Desktop Installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "LocalBridge ${{ github.ref_name }}"
          releaseBody: "See [CHANGELOG.md](CHANGELOG.md) for full release notes."
          releaseDraft: false
          prerelease: false

      - name: Generate SHA256 Checksums
        shell: pwsh
        run: |
          Get-ChildItem -Path apps/desktop/src-tauri/target/release/bundle -Recurse -Include *.exe,*.msi | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -Append -FilePath SHA256SUMS.txt -Encoding ascii
          }

      - name: Upload Release Checksums
        uses: softprops/action-gh-release@v2
        with:
          files: SHA256SUMS.txt
